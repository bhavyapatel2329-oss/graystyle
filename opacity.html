<html>
<head>
    <title>CSS Opacity Example</title>

    <style>
        .box1 {
            background-color: red;
            opacity: 0.1;
        }

        .box2 {
            background-color: red;
            opacity: 0.3;
        }

        .box3 {
            background-color: red;
            opacity: 0.5;
        }
		
		   .box4 {
            background-color: red;
            opacity: 0.6;
        }

        .box5 {
            background-color: red;
            opacity: 0.8;
        }

        .box6 {
            background-color: red;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="box1">
        Opacity 1
    </div>

    <div class="box2">
        Opacity 0.5
    </div>

    <div class="box3">
        Opacity 0.1
    </div>
	
	   <div class="box4">
        Opacity 1
    </div>

    <div class="box5">
        Opacity 0.5
    </div>

    <div class="box6">
        Opacity 0.1
    </div>

</body>
</html>
